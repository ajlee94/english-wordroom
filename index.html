ed':''}>下一題\u003c/button>\u003c/div>\u003c/section>\u003caside class=\"stack aside-stack question-sidebar\">\u003csection class=\"panel\">\u003cdiv class=\"panel-top\">\u003ch2>作答進度\u003c/h2>\u003cspan class=\"small muted\">${answered}/${quiz.ids.length}\u003c/span>\u003c/div>\u003cdiv class=\"question-grid\">${quiz.ids.map((id,i)=>`\u003cbutton class=\"${quiz.answers[id]!==undefined?'answered':''} ${i===quizIndex?'current':''}\" data-action=\"question-jump\" data-index=\"${i}\" aria-label=\"第${i+1}題${quiz.answers[id]!==undefined?'，已答':''}\">${i+1}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"progress-line\">\u003cdiv class=\"progress-track\">\u003cdiv style=\"width:${answered/quiz.ids.length*100}%\">\u003c/div>\u003c/div>\u003c/div>${!submitted?`\u003cbutton class=\"btn dark wide\" data-action=\"submit-quiz\" style=\"margin-top:24px\">${quiz.mode==='exam'?'交卷並查看解析':'完成練習並看結果'}\u003c/button>`:''}\u003c/section>\u003csection class=\"panel quote-card\">\u003ch3>${quiz.mode==='exam'&&!submitted?'把注意力放在題目':'找出不熟的字，比猜對更重要'}\u003c/h3>\u003cp class=\"small muted\" style=\"margin-top:12px\">${quiz.mode==='exam'&&!submitted?'答案與目前位置會持續儲存。離開前請確認右上角顯示已儲存。':'遇到不認識的字，可先加入單字本；之後用遮答案回想，把字義重新接起來。'}\u003c/p>\u003c/section>\u003c/aside>\u003c/div>`}\nfunction renderSources(){if(examHelpLocked())return examHelpNotice();return head('SOURCES','原題與參考資料')+`\u003cdiv class=\"source-list\">${DATA.papers.map(p=>`\u003carticle class=\"source-item\">\u003cdiv class=\"panel-top\">\u003ch2>${esc(p.title)}\u003c/h2>\u003cspan class=\"pill\">${p.reviewed}／${p.total} 題可練習\u003c/span>\u003c/div>\u003cdiv class=\"source-links\">\u003ca href=\"${sourceLink(p,\"paper\",p.questionPages[0])}\" target=\"_blank\" rel=\"noopener\">原題\u003c/a>\u003ca href=\"${sourceLink(p,\"key\",p.keyPages[0])}\" target=\"_blank\" rel=\"noopener\">${esc(p.keyLabel||\"官方初答\")}\u003c/a>\u003ca href=\"${sourceLink(p,\"appeal\",p.appealPages[0])}\" target=\"_blank\" rel=\"noopener\">${p.appealPages.length?'官方釋疑':'釋疑原件（ ingDetail(w)}${renderPronunciationEvidence(w)}\u003cdiv class=\"buttonrow\" style=\"margin-top:23px\">\u003cbutton class=\"btn primary\" data-action=\"modal-add\" data-id=\"${w.id}\">${state.cards[id]?'已加入 · 開始回想':state.archivedCards[id]?'還原收藏':'加入單字本'}\u003c/button>\u003ca class=\"btn\" href=\"${esc(w.dictionaryUrl)}\" target=\"_blank\" rel=\"noopener\">查看詞典\u003c/a>${membershipControl(id)}\u003c/div>\u003cp class=\"footer-note\">${esc(w.frequencyScope)} · ${esc(wordFrequencyLabel(w))}\u003cbr>${esc(w.accent||\"英式 IPA\")}；音訊為裝置合成語音。\u003c/p>`)}\nfunction speak(id,teachingViewId=null){if(cardHelpLocked(id)){toast('提交這題或完整題組後才能播放教學讀音');return}if(!('speechSynthesis'in window)){toast('這個瀏覽器不支援朗讀，可由詞典連結聽發音');return}const tv=teachingViewId?getTypedView(teachingViewId):null;if(teachingViewId&&(!tv||tv.cardId!==id))return;let w=tv?tv.payload:getWord(id);if(!w)return;let u=new SpeechSynthesisUtterance((w.id==='q9-pattern-be-used-to-v'?'be used to':w.pronunciationText||w.lemma).split('（')[0].replace(/\\s*\\/\\s*/g,'. '));u.lang=w.accent?.includes('美式')?'en-US':'en-GB';u.rate=state.settings.speechRate;let voice=speechSynthesis.getVoices().find(v=>v.lang===u.lang)||speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'));if(voice)u.voice=voice;u.onerror=()=>toast('朗讀暫時無法播放，可使用詞典中的發音');speechSynthesis.cancel();speechSynthesis.speak(u)}\nfunction exportState(){downloadProgress(state,'後中醫・英文練習-學習備份')}\nfunction downloadProgress(data,filename){let body={app:'Wordroom',format:1,exportedAt:new Date().toISOString(),data};let blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${filename}-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已準備進度備份，請確認下載完成')}\nlet pendingImport=null;\nasync function importFile(file){if(!file)return;try{if(file.size>10000000)throw Error('備份超過10MB，請選擇有效的後中醫・英文練習進度檔');let raw=JSON.parse(await file.text());if(raw.app!=='Wordroom'||raw.format!==1)throw Error('不是支援的後中醫・英文練習備份檔');pendingImport=validateState(raw.data);openModal(`\u003cdiv class=\"dialoghead\">\u003ch2>確認匯入進度\u003c/h2>\u003cbutton class=\"round-btn\" data-action=\"close-modal\" aria-label=\"取消\">${icon('close')}\u003c/button>\u003c/div>\u003cp>備份內有 ${Object.keys(pendingImport.cards).length} 個已存單字、${Object.keys(pendingImport.archivedCards).length} 個已取消收藏、${pendingImport.history.length} 筆學習紀錄${pendingImport.quiz?'，以及一份作答進度':''}。\u003c/p>\u003cdiv class=\"notice\" style=\"margin-top:20px\">確認後會取代目前學習進度。建議先匯出目前進度留存。\u003c/div>\u003cdiv class=\"buttonrow\">\u003cbutton class=\"btn\" data-action=\"export\">先匯出目前進度\u003c/button>\u003cbutton class=\"btn primary\" data-action=\"confirm-import\">確認取代並匯入\u003c/button>\u003cbutton class=\"btn\" data-action=\"close-modal\">取消\u003c/button>\u003c/div>`)}catch(e){toast(e.message)}finally{$('#import-file').value=''}}\nfunction showRecovery(draft){recoveryKey=draft.storageKey;openModal(`\u003cdiv class=\"dialoghead\">\u003ch2>找到未同步的學習進度\u003c/h2>\u003cbutton class=\"round-btn\" data-action=\"close-modal\" aria-label=\"稍後再處理\">${icon('close')}\u003c/button>\u003c/div>\u003cp>這個瀏覽器保留了 ${dateText(draft.at)} 的待同步內容，可能來自上次意外中斷。\u003c/p>\u003cp class=\"small muted\" style=\"margin-top:15px\">恢復會用該草稿取代目前載入的進度；也可保留雲端版本。建議先匯出目前進度。\u003c/p>\u003cdiv class=\"buttonrow\" style=\"margin-top:24px\">\u003cbutton class=\"btn primary\" data-action=\"recover-draft\">恢復待同步內容\u003c/button>\u003cbutton class=\"btn\" data-action=\"discard-draft\">保留已載入版本\u003c/button>\u003c/div>`)}\nfunction diagnostic(){if(examHelpLocked()||state.quiz&&!state.quiz.submitted){toast('請先完成測驗，再開始暖身');return}diagnosticIndex=0;diagnosticAnswers=[];diagnosticRender()}\nfunction diagnosticRender(){if(examHelpLocked()||state.quiz&&!state.quiz.submitted){toast('請先提交本次練習，再做暖身辨識');return}let ids=['health','evidence','effect','claim','relief'];if(diagnosticIndex>=ids.length){let unknown=diagnosticAnswers.filter(x=>!x.known).map(x=>x.id);state.diagnostic={at:Date.now(),unknown};unknown.forEach(id=>{restoreArchivedCard(id);if(!state.cards[id])state.cards[id]={due:Date.now(),interval:0,reps:0,lapses:0,weak:true,addedAt:Date.now(),last:null};else state.cards[id].weak=true});state.history.push({kind:'diagnostic',at:Date.now()});persist();openModal(`\u003cdiv class=\"dialoghead\">\u003ch2>暖身完成，從這裡接著學\u003c/h2>\u003cbutton class=\"round-btn\" data-action=\"close-modal\" aria-label=\"關閉\">${icon('close')}\u003c/button>\u003c/div>\u003cp>${unknown.length?`已把 ${unknown.map(id=>getWord(id).lemma).join('、')} 放進個人弱字，之後會先安排回想。`:'這幾個核心字對你已經有些熟悉，可以繼續學原題字彙，或回想一次確認。'}\u003c/p>\u003cdiv class=\"hintbox\">這不是能力測驗，也不推定你的英文程度。只是幫你找到今天值得重新拾起的字。\u003c/div>\u003cbutton class=\"btn primary\" data-action=\"diagnostic-done\" style=\"margin-top:24px\">開始到期複習\u003c/button>`);render();return}let w=getWord(ids[diagnosticIndex]);let choices=[w,...DATA.words.filter(x=>x.layer==='core'&&x.id!==w.id).slice(diagnosticIndex%3,diagnosticIndex%3+3)].sort((a,b)=>a.id.localeCompare(b.id));openModalSafe(`\u003cdiv class=\"dialoghead\">\u003cspan class=\"eyebrow\">暖身辨識 ${diagnosticIndex+1} / 5 · 不計分\u003c/span>\u003cbutton class=\"round-btn\" data-action=\"close-modal\" aria-label=\"略過暖身\">${icon('close')}\u003c/button>\u003c/div>\u003ch2 class=\"modal-word\">${w.lemma}\u003c/h2>\u003cp class=\"muted small\">哪個意思最接近？不用猜，也可以直接選不知道。\u003c/p>\u003cdiv class=\"diagnostic-options\">${choices.map(c=>`\u003cbutton class=\"btn\" data-action=\"diagnostic-answer\" data-id=\"${w.id}\" data-known=\"${c.id===w.id}\">${esc(c.meaning)}\u003c/button>`).join('')}\u003cbutton class=\"btn dark\" data-action=\"diagnostic-answer\" data-id=\"${w.id}\" data-known=\"false\">我不知道\u003c/button>\u003c/div>`)}\nfunction openModalSafe(html){$('#modal').innerHTML=html;if(!$('#modal').open)$('#modal').showModal()}\nfunction submitQuiz(){const q=state.quiz;if(!q||q.submitted)return;let unanswered=q.ids.length-Object.keys(q.answers).length;if(unanswered){openModal(`\u003cdiv class=\"dialoghead\">\u003ch2>還有 ${unanswered} 題未作答\u003c/h2>\u003cbutton class=\"round-btn\" data-action=\"close-modal\" aria-label=\"繼續作答\">${icon('close')}\u003c/button>\u003c/div>\u003cp>未作答會保留為空白；交卷後就不能再改答案。\u003c/p>\u003cdiv class=\"buttonrow\" style=\"margin-top:25px\">\u003cbutton class=\"btn primary\" data-action=\"confirm-submit\">仍然交卷\u003c/button>\u003cbutton class=\"btn\" data-action=\"close-modal\">繼續作答\u003c/button>\u003c/div>`)}else finishQuiz()}\nfunction finishQuiz(){closeModal();const q=state.quiz;if(!q||q.submitted)return;q.submitted=true;let correct=q.ids.filter(id=>isCorrect(Q.get(id),q.answers[id])).length;state.history.push({kind:'quiz',at:Date.now(),correct,total:q.ids.filter(id=>!isFullCredit(Q.get(id))).length});persist();render();window.scrollTo({top:0})}\nfunction endQuiz(){let q=state.quiz;if(!q)return;if(q.submitted){state.quiz=null;persist();render();return}openModal(`\u003cdiv class=\"dialoghead\">\u003ch2>先休息一下？\u003c/h2>\u003cbutton class=\"round-btn\" data-action=\"close-modal\" aria-label=\"關閉\">${icon('close')}\u003c/button>\u003c/div>\u003cp>可以保留目前作答，回到今天；或放棄這份練習重新選題。\u003c/p>\u003cdiv class=\"buttonrow\" style=\"margin-top:25px\">\u003cbutton class=\"btn primary\" data-action=\"pause-quiz\">保留進度並離開\u003c/button>\u003cbutton class=\"btn\" data-action=\"discard-quiz\">放棄這份作答\u003c/button>\u003cbutton class=\"btn\" data-action=\"close-modal\">繼續作答\u003c/button>\u003c/div>`)}\nfunction openContextQuiz(id){const w=getWord(id),qid=w?.questionIds?.[0],q=Q.get(qid);if(!q){toast('這個字尚無已核實原題連結');return}const paper=DATA.papers.find(p=>p.id===q.sourceId);let ids=atomicTen(DATA.questions.filter(x=>x.sourceId===q.sourceId),null,qid),whole=false;if(!ids&&paper?.annualReady){ids=paper.questionIds;whole=true}if(!ids){toast('資料不足，無法包含完整原題組');return}closeModal();startQuiz('practice',ids,`${paper.title} · ${whole?'完整卷中的單字原題':'單字回原題'}`);quizIndex=ids.indexOf(qid);state.quiz.index=quizIndex;persist();render();if(whole)toast('此題組無法放入10題練習，已保留完整年度並定位原題');window.scrollTo({top:0})}\nfunction contextWord(id){let w=getWord(id);if(!w||!w.questionIds.length){toast('這個字尚無已核實原題連結');return}const qid=w.questionIds[0];if(!state.quiz||state.quiz.submitted){openContextQuiz(id);return}if(state.quiz.mode==='exam'){toast('目前測驗中，請先交卷後再查看字義與原題');nav('exams');return}const n=state.quiz.ids.indexOf(qid);if(n\u003c0){openModal(`\u003cdiv class=\"dialoghead\">\u003ch2>改練這個字的原題？\u003c/h2>\u003cbutton class=\"round-btn\" data-action=\"close-modal\" aria-label=\"取消\">${icon('close')}\u003c/button>\u003c/div>\u003cp>目前有一份尚未完成的練習。改練會放棄該份作答，另開保留完整題組的練習；題組超過10題時，會開啟整年度並定位原題。\u003c/p>\u003cdiv class=\"buttonrow\" style=\"margin-top:24px\">\u003cbutton class=\"btn primary\" data-action=\"replace-quiz-for-word\" data-id=\"${id}\">改練這個字\u003c/button>\u003cbutton class=\"btn\" data-action=\"close-modal\">保留目前作答\u003c/button>\u003c/div>`);return}view='exams';quizIndex=n;state.quiz.index=n;persist();render();window.scrollTo({top:0})}\ndocument.addEventListener('click',async e=>{let el=e.target.closest('[data-action]');if(!el||el.disabled||!el.isConnected)return;let a=el.dataset.action,id=el.dataset.id;if(e.detail>1&&['remove-word','undo-remove','collect-token'].includes(a))return;if(id&&!reviewedCanonicalRecordValid(W.get(id)))return;switch(a){case'remove-word':removeWord(id);break;case'undo-remove':undoRemove(el.dataset.removal);break;case'dismiss-removals':undoRemovals=[];render();$('#workspace').focus({preventScroll:true});break;case'speak-view':{const v=getTypedView(id);if(v)speak(v.cardId,id);break}case'collocation-view':collocationViewModal(id,true,false);break;case'practice-view':collocationViewModal(id,false,true);break;case'reveal-view':collocationViewModal(id,true,true);break;case'grade-view':gradeCollocationView(id,el.dataset.rating);break;case'toggle-marking':markingWords=!markingWords;render();break;case'collect-token':collectToken(el.dataset.qid,el.dataset.field,Number(el.dataset.start),Number(el.dataset.end),el.dataset.reviewedSource);break;case'save-personal-note':if(!examHelpLocked()&&state.personalWords[id]){state.personalWords[id].note=$('#personal-note').value.slice(0,2000);persist();personalModal(id);toast('已儲存個人筆記');}break;case'mark-weak':if(!examHelpLocked()){addWord(id,true);state.cards[id].due=Date.now();persist();toast('已排入優先複習');}break;case'choose-paper':choosingPaper=true;render();break;case'resume-quiz':choosingPaper=false;render();break;case'selected-annual':selectedAnnual(el.dataset.mode);break;case'confirm-annual':selectedAnnual(el.dataset.mode,true);break;case'nav':nav(el.dataset.target);break;case'begin':begin(el.dataset.kind);break;case'layer':state.settings.layer=el.dataset.layer;studyIds=[];state.session=null;persist();render();break;case'recall-mode':recallMode=el.dataset.mode;currentReveal=false;currentGuess='';render();break;case'reveal':currentGuess=$('#recall-input')?.value||'';currentReveal=true;render();break;case'unknown':currentGuess='';currentReveal=true;render();toast('不知道沒關係，看完後選「還想不起來」');break;case'rate':rate(id,el.dataset.rating);break;case'word':wordModal(id);break;case'lookup':wordModal(id,true);break;case'add-word':addWord(id);render();break;case'modal-add':if(state.cards[id]){closeModal();begin('review',[id])}else{addWord(id);wordModal(id)}break;case'restore-personal':if(state.personalWords[id]&&state.archivedCards[id]){const note=$('#personal-note');if(note?.dataset.wordId===id)state.personalWords[id].note=note.value.slice(0,2000);addWord(id);render();personalModal(id)}break;case'single-review':if(state.archivedCards[id]){toast('請先還原收藏，再開始回想');break}closeModal();begin('review',[id]);break;case'speak':speak(id);break;case'context':contextWord(id);break;case'replace-quiz-for-word':openContextQuiz(id);break;case'close-modal':closeModal();break;case'start-quiz':startQuiz(el.dataset.mode);break;case'annual':{let p=DATA.papers.find(x=>x.id===$(`#year-${el.dataset.school}`).value);if(p?.annualReady)startQuiz(el.dataset.mode||'practice',p.questionIds,p.title+' · 整年度');break}case'mixed':{let pool=DATA.questions.filter(q=>el.dataset.school==='all'||q.school===el.dataset.school);let ids=atomicTen(pool,el.dataset.school==='all'?'school':'year');if(!ids)toast('目前無法組成保留完整題組的10題');else startQuiz(el.dataset.mode==='exam'?'exam':'practice',ids,el.dataset.school==='all'?'跨校混合 · 10題':'同校跨年度 · 10題');break}case'answer':{let q=state.quiz;let qid=q.ids[quizIndex];if(q.submitted||q.checked.includes(qid))break;q.answers[qid]=Number(el.dataset.index);persist();render();break}case'check-answer':checkPracticeQuestion(state.quiz.ids[quizIndex]);break;case'confirm-check-group':checkPracticeQuestion(id,true);break;case'question-prev':quizIndex=Math.max(0,quizIndex-1);state.quiz.index=quizIndex;persist();render();window.scrollTo({top:0});break;case'question-next':quizIndex=Math.min(state.quiz.ids.length-1,quizIndex+1);state.quiz.index=quizIndex;persist();render();window.scrollTo({top:0});break;case'question-jump':quizIndex=Number(el.dataset.index);state.quiz.index=quizIndex;persist();render();window.scrollTo({top:0});break;case'submit-quiz':submitQuiz();break;case'confirm-submit':finishQuiz();break;case'end-quiz':endQuiz();break;case'pause-quiz':closeModal();persist();nav('home');break;case'discard-quiz':closeModal();state.quiz=null;persist();render();break;case'export':exportState();break;case'portable-sources':portableSourcesModal();break;case'export-portable-source':exportPortableSource(el.dataset.key);break;case'import':$('#import-file').click();break;case'confirm-import':if(pendingImport){try{replaceProgressState(pendingImport,{via:'import'});undoRemovals=[];pendingImport=null;studyIds=[];studyIndex=0;closeModal();persist();render();toast('已匯入進度，請確認同步狀態')}catch(e){toast(e.message)}}break;case'retry':if(saveInFlight||loadInFlight){toast('正在同步，請稍候完成');break}if(initialReadFailed){await load();break}if(conflict){toast(portable?'請先匯出本頁與舊版備份；未解決衝突前不會覆寫。':'請先匯出本頁備份，再重新載入雲端進度');break}if(status==='local'){location.href='/signin-with-chatgpt?return_to=%2Froom.html';break}if(dirty){flush()}else{loaded=false;await load()}break;case'reload':location.reload();break;case'recover-draft':recoverDraft();break;case'discard-draft':try{localStorage.removeItem(recoveryKey||DRAFT_KEY)}catch{}closeModal();break;case'save-settings':{let n=$('#new-goal'),m=$('#minutes-goal');if(!n.reportValidity()||!m.reportValidity())break;state.settings.newPerDay=Number(n.value);state.settings.minutes=Number(m.value);state.settings.speechRate=Number($('#speech-rate').value);persist();toast('已更新學習步調');break}case'diagnostic':diagnostic();break;case'diagnostic-answer':diagnosticAnswers.push({id,known:el.dataset.known==='true'});diagnosticIndex++;diagnosticRender();break;case'diagnostic-done':closeModal();begin('review');break;}});\ndocument.addEventListener('input',e=>{if(e.target.id==='word-search'){let pos=e.target.selectionStart;wordQuery=e.target.value;render();let input=$('#word-search');input.focus();input.setSelectionRange(pos,pos)}if(e.target.id==='recall-input')currentGuess=e.target.value});\ndocument.addEventListener('change',e=>{if(e.target.id==='word-filter'){wordFilter=e.target.value;render()}if(e.target.id==='import-file')importFile(e.target.files[0])});\ndocument.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='recall-input'){e.preventDefault();currentGuess=e.target.value;currentReveal=true;render()}});\nwindow.addEventListener('beforeunload',e=>{if(dirty||saveInFlight){writeDraft();e.preventDefault();e.returnValue=''}});\n\nwindow.addEventListener('storage',e=>{\n if(portable&&LEGACY_PORTABLE_KEYS.includes(e.key)&&loaded){try{if(portableOriginsChanged()){conflict=true;writeDraft();setStatus('error',portableOriginWarning)}}catch{conflict=true;setStatus('error','無法核對舊版離線進度，請先匯出備份')}return}\n if(portable&&e.key===PORTABLE_KEY&&loaded&&!dirty&&!saveInFlight&&!$('#modal').open){load();return}\n if(!portable&&e.key==='wordroom-synced-v2'&&loaded&&!dirty&&!saveInFlight&&!loadInFlight&&!conflict&&!$('#modal').open){try{const signal=JSON.parse(e.newValue);if(signal?.scope===accountScope&&signal.version>version)load()}catch{}}\n});\ndocument.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty)flush()});\nconst modelContext=document.modelContext;\nif(modelContext?.registerTool){const lifecycle=new AbortController();const defs=[\n{name:'wordroom_progress_summary',title:'查看後中醫・英文練習進度',description:'Read current study progress and verified corpus coverage without changing data.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:async(input)=>{if(input&&Object.keys(input).length)throw Error('No fields accepted');return {savedWords:savedWords().length,due:dueWords().length,reviewedQuestions:DATA.questions.length,fullPapers:DATA.papers.filter(p=>p.annualReady).length,syncStatus:status}}},\n{name:'wordroom_start_review',title:'開始到期複習',description:'Start the due-word review flow shown in the interface; saves the session but does not rate words or reveal answers.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:async(input)=>{if(input&&Object.keys(input).length)throw Error('No fields accepted');if(!loaded)throw Error('Progress still loading');begin('review');return {view,count:studyIds.length,syncStatus:status}}}\n];for(const tool of defs){try{Promise.resolve(modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{})}catch{}}window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});}\nrender();load();\n// Testable pure helpers, with no credential or hidden answers beyond the existing learning data.\nwindow.Wordroom={qualifiedEvidenceFor,renderQualifiedEvidence,getCollocationView,approvedCollocationViews,collocationViewModal,gradeCollocationView,renderLearningDetail,lexicalTokens,validCollectRange,approvedEvidenceFor,mappedSourceUnits,e \n"},{"path":"source/src/theme.css","content":"\n/* Appearance is isolated from learning data and the study engines. */\n:root{--theme-surface:#fff;--theme-raised:#f2f4f7;--theme-text:#172c42;--theme-muted:#526270;--theme-control:#748392;--theme-focus:#845b16;--theme-accent:#234c72;--theme-on-accent:#fff;--theme-mint:#225d45;--theme-mint-soft:#e7f4ee;--theme-lavender:#67508b;--theme-lavender-soft:#f0eaf7;--theme-apricot:#815220;--theme-apricot-soft:#fff0db;--theme-error:#a93940;--theme-error-soft:#faedf0}\nhtml[data-theme=dark]{--theme-surface:#191a1d;--theme-raised:#25272d;--theme-text:#f1f0f5;--theme-muted:#c0bfca;--theme-control:#8b8c9a;--theme-focus:#f0c997;--theme-accent:#cfbaf4;--theme-on-accent:#241b32;--theme-mint:#abe0c2;--theme-mint-soft:#21372c;--theme-lavender:#d3bdf6;--theme-lavender-soft:#30263f;--theme-apricot:#efc398;--theme-apricot-soft:#392c22;--theme-error:#ffb5bf;--theme-error-soft:#422730;--ink:var(--theme-text);--muted:var(--theme-muted);--line:#454650;--blue:var(--theme-accent);--soft:var(--theme-lavender-soft);--bg:#0b0b0d;--paper:#0b0b0d;--white:var(--theme-surface);--blue-light:var(--theme-lavender-soft);--green:var(--theme-mint);--greensoft:var(--theme-mint-soft);--red:var(--theme-error);--redsoft:var(--theme-error-soft);--success:var(--theme-mint);--danger:var(--theme-error);--lime:var(--theme-mint);--accent:var(--theme-mint);--shadow:0 12px 36px #00000030}\n.appearance{display:inline-flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--theme-control);border-radius:11px;background:var(--theme-surface);color:var(--theme-text);flex-shrink:0;max-width:100%;font-family:inherit;font-size:14px;line-height:1.5}\n.appearance-label{padding:0 8px;font-size:13px;color:var(--theme-muted)}\n.appearance button{border:1px solid transparent;border-radius:7px;background:transparent;color:var(--theme-muted);font:inherit;font-size:13px;min-height:38px;padding:6px 10px;cursor:pointer;white-space:nowrap}\n.appearance button:hover{background:var(--theme-raised);color:var(--theme-text)}\n.appearance button[aria-pressed=true]{background:var(--theme-accent);color:var(--theme-on-accent);font-weight:700}\n.appearance button:focus-visible{outline:3px solid var(--theme-focus);outline-offset:3px}\n.appearance-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}\nhtml[data-theme=dark] body{background:#0b0b0d;color:var(--theme-text)}\nhtml[data-theme=dark] dialog{background:var(--theme-surface);color:var(--theme-text);box-shadow:0 24px 100px #0009}\nhtml[data-theme=dark] dialog::backdrop{background:#000b}\nhtml[data-theme=dark] :is(input,select,textarea){color-scheme:dark;background-color:var(--theme-surface);color:var(--theme-text);border-color:var(--theme-control);accent-color:var(--theme-accent)}\nhtml[data-theme=light] :is(input,select,textarea){color-scheme:light}\nhtml[data-theme=dark] ::placeholder{color:var(--theme-muted);opacity:1}\nhtml[data-theme=dark] :is(button,a,summary,input,select,textarea):focus-visible{outline-color:var(--theme-focus)}\nhtml[data-theme=dark] button:disabled{opacity:1;cursor:not-allowed}\nhtml[data-theme=dark] button:disabled:not(.option):not(.choice):not(.classical-title-button){background:var(--theme-raised);color:var(--theme-muted);border-color:var(--theme-control)}\nhtml[data-theme=dark] .bounded-review-entry{background:var(--theme-mint-soft)!important;color:var(--theme-text);border-color:var(--theme-control)!important}\nhtml[data-theme=dark] .bounded-review-entry a{color:var(--theme-mint)!important}\n@media(max-width:760px){.appearance button{min-height:42px;padding:7px 12px}.appearance-label{padding:0 7px}}\n@media(prefers-reduced-motion:reduce){.appearance button{transition:none}}\n\n.appearance-bar{display:flex;justify-content:flex-end;margin:-16px 0 24px}\n@media(max-width:720px){.appearance-bar{margin:-12px 0 22px}.appearance-bar .appearance{margin-left:auto}}\nhtml[data-theme=dark] :is(.skip,.btn,.stats,.segmented,.round-btn,.search,.filter,.word-list,.paper-card,.choice,.question-grid button,.vocab-chips button,.source-item){background:var(--theme-surface);color:var(--theme-text)}\nhtml[data-theme=dark] :is(.btn,.segmented,.round-btn,.search,.filter,.choice,.choice b,.question-grid button,.vocab-chips button,.answer-cover,.field input,.field select,.cloze-input){border-color:var(--theme-control)}\nhtml[data-theme=dark] :is(.brandmark,.navbutton.active,.btn.primary,.btn.dark,.segmented button.active,.choice.selected b){background:var(--theme-lavender);color:var(--theme-on-accent);border-color:var(--theme-lavender)}\nhtml[data-theme=dark] :is(.btn.primary:hover,.btn.dark:hover){background:#dfcef8;color:var(--theme-on-accent)}\nhtml[data-theme=dark] .btn.lime{background:var(--theme-mint);color:#15281c;border-color:var(--theme-mint)}\nhtml[data-theme=dark] .btn.lime:hover{background:#c7edd8;color:#15281c}\nhtml[data-theme=dark] .btn.ghost{background:transparent;color:var(--theme-accent)}\nhtml[data-theme=dark] .btn:not(.primary):not(.dark):not(.lime):not(.ghost):hover,html[data-theme=dark] .choice:hover:not(:disabled):not(.selected):not(.correct):not(.wrong),html[data-theme=dark] .word-token:hover:not(.collected),html[data-theme=dark] .word-token:focus-visible:not(.collected){background:var(--theme-raised);border-color:var(--theme-lavender)}\nhtml[data-theme=dark] :is(.navsection,.quote-card .citation,.session-card .eyebrow,.session-card .description,.session-meta){color:var(--theme-muted)}\nhtml[data-theme=dark] .navcount{background:#231931;color:#f1f0f5}\nhtml[data-theme=dark] .session-card{background:#20252a;color:var(--theme-text);border-color:var(--theme-control)}\nhtml[data-theme=dark] .session-divider{background:var(--line)}\nhtml[data-theme=dark] .quote-card{border-color:var(--theme-lavender)}\nhtml[data-theme=dark] .quote-card .meaning{color:var(--theme-text)}\nhtml[data-theme=dark] .progress-track{background:var(--theme-raised)}\nhtml[data-theme=dark] .pill.green{background:var(--theme-mint-soft);color:var(--theme-mint)}\nhtml[data-theme=dark] :is(.pill.amber,.notice){background:var(--theme-apricot-soft);color:var(--theme-apricot);border-color:var(--theme-apricot)}\nhtml[data-theme=dark] .notice.error{background:var(--theme-error-soft);color:var(--theme-error);border-color:var(--theme-error)}\nhtml[data-theme=dark] .rate-row .primary span{color:var(--theme-on-accent)}\nhtml[data-theme=dark] .question-stem{color:var(--theme-text)}\nhtml[data-theme=dark] .passage{background:var(--theme-raised)}\nhtml[data-theme=dark] .choice.selected{background:var(--theme-lavender-soft);color:var(--theme-lavender);border-color:var(--theme-lavender)}\nhtml[data-theme=dark] :is(.question-grid button.answered,.vocab-chips button.saved){background:var(--theme-lavender-soft);color:var(--theme-lavender);border-color:var(--theme-lavender)}\nhtml[data-theme=dark] .choice.correct{background:var(--theme-mint-soft);color:var(--theme-text);border-color:var(--theme-mint)}\nhtml[data-theme=dark] .choice.wrong{background:var(--theme-error-soft);color:var(--theme-text);border-color:var(--theme-error)}\nhtml[data-theme=dark] .choice.correct b{background:var(--theme-mint);color:#15281c;border-color:var(--theme-mint)}\nhtml[data-theme=dark] .choice.wrong b{background:var(--theme-error);color:#341921;border-color:var(--theme-error)}\nhtml[data-theme=dark] .toast{background:var(--theme-lavender);color:var(--theme-on-accent)}\nhtml[data-theme=dark] .annual-picker{background:linear-gradient(120deg,#30263f 0%,#191a1d 70%);border-color:var(--theme-lavender)}\nhtml[data-theme=dark] .word-token{border-color:var(--theme-control)}\nhtml[data-theme=dark] .word-token.collected{background:var(--theme-mint-soft);color:var(--theme-mint);border-color:var(--theme-mint)}\n@media(max-width:720px){html[data-theme=dark] .sidebar{background:#191a1df5}}\n\n/* Control boundaries and disabled labels stay visible in both palettes. */\nhtml[data-theme=light] button:disabled{opacity:1}\nhtml[data-theme=light] button:disabled:not(.option):not(.choice):not(.classical-title-button){background:#eef1f5;color:#526270;border-color:var(--theme-control)}\nhtml[data-theme=light] :is(input,select,textarea){border-color:var(--theme-control)}\nhtml[data-theme=light] ::placeholder{color:var(--theme-muted);opacity:1}\nhtml[data-theme=light] :is(.secondary,.mode-btn,.year-chip,.option,.option-label,.phonetic-types button,.study-segments button,.study-marks button,.classical-check,.classical-anchors a,.segmented,.round-btn,.choice,.choice b,.question-grid button,.vocab-chips button,.answer-cover){border-color:var(--theme-control)}\nhtml[data-theme=light] .btn:not(.primary):not(.dark):not(.lime):not(.ghost){border-color:var(--theme-control)}\nhtml[data-theme=light] .choice.selected{border-color:var(--blue)}\nhtml[data-theme=light] .choice.correct{border-color:#498564}\nhtml[data-theme=light] .choice.wrong{border-color:#b3535d}\nhtml[data-theme=light] .choice.selected b{border-color:var(--blue)}\nhtml[data-theme=light] .choice.correct b{border-color:var(--success)}\nhtml[data-theme=light] .choice.wrong b{border-color:var(--danger)}\n\n/* A storage failure is readable on screen as well as in the polite live region. */\n.appearance{flex-wrap:wrap}\n.appearance-status:not(:empty){position:static;width:auto;height:auto;overflow:visible;clip:auto;white-space:normal;flex:1 0 100%;max-width:100%;padding:7px 8px 5px;overflow-wrap:anywhere;border-top:1px solid var(--theme-control);font-size:12px;line-height:1.5;color:var(--theme-apricot);background:var(--theme-apricot-soft);border-radius:0 0 7px 7px}\n\n/* Reversible wordbook membership; no destructive delete control. */\n.removed-notice{margin:0 0 24px;padding:18px;border:1px solid var(--theme-mint);border-radius:14px;background:var(--theme-mint-soft);color:var(--theme-text)}\n.removed-notice ul{list-style:none;margin:12px 0;padding:0;display:grid;gap:8px}\n.removed-notice li{display:flex;align-items:center;justify-content:space-between;gap: wer-cyan);color:var(--answer-cyan)}\nhtml[data-theme] :is(.option.correct,.option.wrong,.option.neutral-selected,.choice.selected,.choice.correct,.choice.wrong) :is(.option-label,b,.option-status){background:transparent;color:var(--answer-ink);border-color:currentColor}\nhtml[data-theme] #attempt .options button[data-do=answer][aria-pressed=true]:disabled:not(.correct):not(.wrong){background:var(--answer-neutral);color:var(--answer-ink);border-color:var(--answer-cyan);box-shadow:inset 0 0 0 1px var(--answer-cyan);opacity:1}\n"},{"path":"source/src/theme.js","content":"(function(){'use strict';\nvar root=document.documentElement,key='medical-english-appearance-v1',mode='dark',media=null,status='';\ntry{var stored=localStorage.getItem(key);if(['light','dark','system'].indexOf(stored)!==-1)mode=stored;}catch(e){status='外觀設定無法讀取；本次先使用深色。';}\ntry{media=window.matchMedia('(prefers-color-scheme: dark)');}catch(e){}\nfunction apply(){var resolved=mode==='system'?(media&&media.matches?'dark':'light'):mode;root.dataset.theme=resolved;root.dataset.themeMode=mode;var meta=document.querySelector('meta[name=\"theme-color\"]');if(meta)meta.content=resolved==='dark'?'#0b1422':'#f5f6f9';}\nfunction sync(){document.querySelectorAll('[data-appearance]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.appearance===mode));});var s=document.getElementById('appearanceStatus');if(s)s.textContent=status;}\napply();\nfunction systemChanged(){if(mode==='system'){apply();sync();}}\nif(media){if(media.addEventListener)media.addEventListener('change',systemChanged);else if(media.addListener)media.addListener(systemChanged);}\nfunction init(){sync();document.querySelectorAll('[data-appearance]').forEach(function(button){button.addEventListener('click',function(){var next=button.dataset.appearance;if(['light','dark','system'].indexOf(next)===-1)return;mode=next;status='';try{localStorage.setItem(key,mode);}catch(e){status='外觀已切換，但這次無法儲存。';}apply();sync();});});}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();\n})();"},{"path":"source/review-pilot/app.mjs","content":"import m from './data.mjs';\nimport * as C from './core.mjs';\nconst $=id=>document.getElementById(id),E=x=>String(x??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst key='bounded-review-pilot:'+m.subject+':v1',cloud=m.storage==='cloud'&&location.protocol!=='file:';\nlet state=C.fresh(m),expectedRaw=null,version=0,accountScope=null,readOnly=true,busy=false,dirty=false,status='正在載入試用紀錄…',selected=null,pendingImport=null,sourceFor=null,unreadableRaw=null;\nconst noteDrafts=new Map();\nconst noteKey=(attempt,id)=>attempt+'|'+id;\nfunction captureNotes(){for(const input of document.querySelectorAll('[data-note][data-note-attempt]')){const a=state.attempts.find(a=>a.id===input.dataset.noteAttempt),id=input.dataset.note;if(!a?.submittedAt||!a.questionIds.includes(id))continue;const key=noteKey(a.id,id),saved=a.diagnosis[id]?.note||'';if(input.value!==saved)noteDrafts.set(key,input.value);else noteDrafts.delete(key)}}\nconst displaySourceLabel=label=>String(label||'').replace(/\\s*[·・]?\\s*(?:原\\s*)?PDF\\s*第?\\s*[0-9０-９、–—-]+\\s*頁/g,'').trim()||'原題';\nconst qmap=new Map(m.questions.map(q=>[q.id,q]));\nconst now=()=>new Date();\nconst today=()=>C.localDate(now(),m.dayOffsetMinutes);\nconst safeURL=url=>typeof url==='string'&&(/^(https:\\/\\/|\\/(?!\\/))/.test(url))?url:'#';\nfunction displayStatusError(message){const text=String(message||'');return /(?:Unexpected token|Unexpected end|JSON|SyntaxError|TypeError|NetworkError|Failed to fetch|schema|sha256|accountScope|\bhash\b|\bdebug\b)/i.test(text)?'資料暫時無法讀取或儲存。請保留此頁，先匯出備份後再重試。':text;}\nfunction announce(s){s=displayStatusError(s);$('message').textContent=s}\nfunction current(){return state.attempts.find(a=>a.id===(selected||state.activeAttemptId))}\nfunction banner(){ $('storage-status').textContent=displayStatusError(status); $('storage-status').className=readOnly||dirty?'warning':'muted';$('export').disabled=busy||unreadableRaw!==null||(readOnly&&!dirty&&!state.attempts.length);$('export-raw').hidden=unreadableRaw===null;$('export-raw').disabled=busy; $('import').disabled=readOnly||busy;$('retry').hidden=!readOnly&&!dirty;}\nasync function load(){if(busy)return;busy=true;unreadableRaw=null;noteDrafts.clear();banner();try{\n if(cloud){const r=await fetch('/api/review-pilot',{cache:'no-store'});const body=await r.json();if(!r.ok){if(typeof body.rawRecovery==='string')unreadableRaw=body.rawRecovery;throw Error(body.error||'暫時讀不到雲端試用紀錄')}if(typeof body.accountScope!=='string'||!Number.isInteger(body.version))throw Error('帳號或雲端版本無法核對');try{state=body.data===null?C.fresh(m):C.validate(body.data,m)}catch(e){if(typeof body.rawRecovery==='string')unreadableRaw=body.rawRecovery;throw e}version=body.version;accountScope=body.accountScope;status='試用紀錄以登入帳號另存雲端；原有單字與作答進度不變。'}\n else{expectedRaw=localStorage.getItem(key);try{state=expectedRaw===null?C.fresh(m):C.validate(JSON.parse(expectedRaw),m)}catch(e){unreadableRaw=expectedRaw;throw e}status='試用紀錄另存此瀏覽器，不跨裝置同步；原有作答與熟悉度不變。'}\n readOnly=false;dirty=false;selected=state.activeAttemptId;\n }catch(e){readOnly=true;status=e.message+'。保護模式：未覆寫原資料。'+(unreadableRaw!==null?'可下載原始救援副本，內容保持原樣。':'請稍後重試；尚不能匯出未讀取的紀錄。')+''}finally{busy=false;render(false)}}\nasync function save(next){if(readOnly||busy){announce('尚不能儲存；請先處理儲存提示。');return false}C.validate(next,m);state=next;dirty=true;busy=true;render();try{\n if(cloud){const r=await fetch('/api/review-pilot',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({version,accountScope,data:state})});const d=await r.json();if(!r.ok)throw Error(d.error||'雲端儲存失敗');if(d.accountScope!==accountScope||!Number.isInteger(d.version)||d.version!==version+1)throw Error('儲存回應無法確認；請先匯出，再重新載入');version=d.version;status='試用紀錄已另存雲端；原有進度不變。'}\n else{if(localStorage.getItem(key)!==expectedRaw)throw Error('另一個分頁已改動試用紀錄；請先匯出本頁，再重新載入');const raw=JSON.stringify(state);localStorage.setItem(key,raw);expectedRaw=raw;status='試用紀錄已另存此瀏覽器；原有進度不變。'}dirty=false;\n }catch(e){readOnly=true;status=e.message+'。本頁內容仍保留，請匯出備份；未重試覆寫。'}finally{busy=false;render()}return !dirty}\nfunction download(name,text,type='application/json'){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}\nfunction exportData(){captureNotes();const exported=structuredClone(state);for(const [key,note] of noteDrafts){const [aid,qid]=key.split('|'),a=exported.attempts.find(a=>a.id===aid);if(a&&a.questionIds.includes(qid)){const d=diag(a,qid);d.note=note;if(note)d.enrolled=true}}C.validate(exported,m);download(m.subject+'-錯因試用備份-'+today()+'.json',JSON.stringify({application:'bounded-review-pilot',format:1,exportedAt:now().toISOString(),data:exported},null,2));announce('已準備試用紀錄備份，請確認下載完成。'+(noteDrafts.size?'包含尚未按儲存的提醒文字；不代表已保存到網站。':'')+'這份不含舊版學習資料。')}\nfunction readyButtons(){if(!state.attempts.length)return `\u003cbutton data-do=\"start\" class=\"primary\" ${readOnly||busy?'disabled':''}>自願試用這個小單元\u003c/button>`;const unfinished=state.attempts.find(a=>!a.submittedAt);return unfinished?`\u003cbutton data-do=\"resume\" data-attempt=\"${E(unfinished.id)}\">繼續未完成的一回\u003c/button>`:''}\nfunction render(capture=true){const openDiagnosis=capture?[...document.querySelectorAll('details.diagnosis[open]')].map(d=>d.dataset.diagnosis):[];if(capture)captureNotes();banner();$('subject').textContent=m.subjectLabel+' · 自選小試用';$('title').textContent=m.title;$('scope').textContent=m.scopeNote;$('back').href=m.backUrl;$('local-date').textContent='今日 '+today();\n const a=current(),locked=!!a&&!a.submittedAt;\n $('overview').innerHTML=`\u003cp>這是另開的一小回練習，不會自動收錄原站已做過的題目。可選把握度；提交後記錯因、回看來源，猜對或猶豫也能留下紀錄。\u003c/p>\u003cp class=\"muted\">只記這個小單元；不更動原站成績、作答或學習進度。一次答對與讀過解析都不代表精熟。\u003c/p>${readyButtons()}`;\n $('attempt').innerHTML=a?attemptHTML(a):'';\n $('records').innerHTML=locked?'\u003cp class=\"muted\">目前一回提交前，先前解析、錯因筆記與回看教材暫時遮住。\u003c/p>':recordsHTML();\n $('history').innerHTML=locked?'':historyHTML();\n for(const d of document.querySelectorAll('details.diagnosis'))if(openDiagnosis.includes(d.dataset.diagnosis))d.open=true;\n if(sourceFor&&(!a||a.submittedAt)){const q=qmap.get(sourceFor);$('source-content').innerHTML=sourceHTML(q)}else{sourceFor=null;$('source-dialog').close?.()}\n}\nfunction attemptHTML(a){const submitted=!!a.submittedAt;return `\u003csection class=\"card\">\u003ch2>${a.kind==='variant'?'跨日另一題':'本小單元作答'}\u003c/h2>\u003cp class=\"muted\">${submitted?'已提交，選擇與把握度已鎖定。':'所有題目提交後才揭曉；選好答案後可直接提交，把握度可略過。'}\u003c/p>${m.sourceGroup?`\u003cdetails open class=\"passage\">\u003csummary>${E(m.sourceLabel)}\u003c/summary>\u003cdiv>${E(m.sourceGroup)}\u003c/div>\u003c/details>`:''}${a.questionIds.map(id=>questionHTML(qmap.get(id),a)).join('')}${!submitted?`\u003cbutton class=\"primary\" data-do=\"submit\" data-attempt=\"${E(a.id)}\" ${busy||readOnly?'disabled':''}>${a.questionIds.length>1?'提交完整題組':'提交這一題'}\u003c/button>\u003cp class=\"muted\">可保留未答空白，提交後不能改選；未答不當成答對。\u003c/p>`:'\u003cp class=\"muted\">可直接回到原站，錯因和一句提醒都可略過。\u003c/p>'}\u003c/section>`}\nfunction questionHTML(q,a){const submitted=!!a.submittedAt,o=C.outcome(q,a),d=a.diagnosis[q.id]||{reason:null,note:'',reviewedAt:null,enrolled:false};return `\u003carticle class=\"question\" id=\"question-${E(q.id)}\">\u003cp class=\"muted\">原題 ${q.number}${q.neutral?' · 有爭議，暫不計分':''}\u003c/p>\u003ch3>${E(q.stem)}\u003c/h3>\u003cdiv class=\"options\" role=\"group\" aria-label=\"第${q.number}題選項\">${q.options.map((t,i)=>`\u003cbutton class=\"${submitted&&!q.neutral&&q.answers.includes(i)?'correct':submitted&&!q.neutral&&a.choices[q.id]===i?'wrong':''}\" data-do=\"answer\" data-q=\"${E(q.id)}\" data-value=\"${i}\" aria-pressed=\"${a.choices[q.id]===i}\" ${submitted||busy||readOnly?'disabled':''}>\u003cstrong>${String.fromCharCode(65+i)}\u003c/strong> ${E(t)}\u003c/button>`).join('')}\u003c/div>\u003cfieldset ${submitted||busy||readOnly?'disabled':''}>\u003clegend>作答把握度（選填）\u003c/legend>${[['sure','確定'],['unsure','猶豫'],['guess','猜的']].map(([v,label])=>`\u003cbutton data-do=\"certainty\" data-q=\"${E(q.id)}\" data-value=\"${v}\" aria-pressed=\"${a.certainty[q.id]===v}\">${label}\u003c/button>`).join('')}\u003cbutton data-do=\"certainty\" data-q=\"${E(q.id)}\" data-value=\"\">略過\u003c/button>\u003c/fieldset>${submitted?`\u003csection class=\"solution\">\u003ch4 class=\"result-banner ${o==='correct'?'correct':o==='wrong'?'wrong':'neutral'}\">${({'unscored':'已記錄，不判對錯','blank':'未作答','correct':'這次答對','wrong':'這次答錯'})[o]}${o==='correct'&&a.certainty[q.id]==='guess'?' · 猜對也需回看':o==='correct'&&a.certainty[q.id]==='unsure'?' · 仍有猶豫':''}\u003c/h4>\u003cp class=\"answer-highlight\">你的選擇：${Object.hasOwn(a.choices,q.id)?String.fromCharCode(65+a.choices[q.id]):'留白'}。${q.neutral?'原公告／採用參考':'採用答案'}：${q.answers.map(i=>String.fromCharCode(65+i)).join('／')}\u003c/p>${q.notices.filter(Boolean).map(n=>`\u003cp class=\"notice\">${E(n)}\u003c/p>`).join('')}\u003csection class=\"overall-explanation\">\u003ch4>整題解析\u003c/h4>\u003cp class=\"pre\">${E(q.summary)}\u003c/p>\u003c/section>\u003ch4>逐選項解析\u003c/h4>\u003col class=\"option-explanations\" type=\"A\">${q.explanations.map(s=>`\u003cli class=\"option-explanation\">${E(s)}\u003c/li>`).join('')}\u003c/ol>\u003cbutton data-do=\"source\" data-q=\"${E(q.id)}\">回看：${E(displaySourceLabel(q.source.label))}\u003c/button>\u003cdetails class=\"diagnosis\" data-diagnosis=\"${E(noteKey(a.id,q.id))}\">\u003csummary>錯因與一句提醒（選填）\u003c/summary>\u003clabel>這次卡在哪裡？\u003cselect data-do=\"reason\" data-q=\"${E(q.id)}\" ${readOnly||busy?'disabled':''}>\u003coption value=\"\">尚未選擇／略過\u003c/option>${C.REASONS.map((v,i)=>`\u003coption value=\"${v}\" ${d.reason===v?'selected':''}>${['未學','記不起','讀錯條件或句意','方法選錯','計算／單位','趕時間'][i]}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003clabel>下次先看什麼？（最多240字，可留空）\u003cinput data-note=\"${E(q.id)}\" data-note-attempt=\"${E(a.id)}\" maxlength=\"240\" value=\"${E(noteDrafts.get(noteKey(a.id,q.id))??d.note)}\" ${readOnly||busy?'disabled':''}>\u003c/label>\u003cbutton data-do=\"note\" data-q=\"${E(q.id)}\" ${readOnly||busy?'disabled':''}>儲存一句提醒\u003c/button>${C.needsReview(q,a)?'\u003cp>已列入回看紀錄。\u003c/p>':`\u003cbutton data-do=\"enroll\" data-q=\"${E(q.id)}\" ${readOnly||busy?'disabled':''}>這題答對了，仍想留下回看紀錄\u003c/button>`}\u003c/details>\u003c/section>`:''}\u003c/article>`}\nfunction recordsHTML(){const rs=C.records(state,m);if(!rs.length)return '\u003cp class=\"muted\">尚無回看紀錄。答錯、未答、猶豫、猜的及主動留下的題目會出現在這裡。\u003c/p>';return rs.map(r=>{const st=C.checkStatus(state,m,r),d=r.attempt.diagnosis[r.question.id];const label={'pending-variant':'待重練：尚無核可或尚未用過的另一題','another-day':'另日再練：'+st.due+' 起可開始','ready':'現在可做另一道已核題','checked-once':'已完成一次跨日另一題檢查；未判定精熟'}[st.state];return `\u003carticle class=\"record\">\u003ch3>原題 ${r.question.number}\u003c/h3>\u003cp>${E(label)}\u003c/p>${st.last?`\u003cp>上次另一題結果：${E({'correct':'答對','wrong':'答錯','blank':'未答','unscored':'不計分'}[C.outcome(qmap.get(st.last.questionIds[0]),st.last)])}，把握度：${E({sure:'確定',unsure:'猶豫',guess:'猜的'}[st.last.certainty[st.last.questionIds[0]]]||'未填')}。\u003c/p>`:''}\u003cp class=\"muted\">${d?.reviewedAt?'已回看來源，只代表閱覽，不代表已學會。':'尚未標記回看來源。'}${d?.note?' 提醒：'+E(d.note):''}\u003c/p>\u003cdiv class=\"actions\">\u003cbutton data-do=\"show\" data-attempt=\"${E(r.attempt.id)}\">回看這回完整題組與解析\u003c/button>${st.state==='ready'?`\u003cbutton class=\"primary\" data-do=\"variant\" data-record=\"${E(r.id)}\" ${busy||readOnly?'disabled':''}>跨日另一題\u003c/button>`:''}\u003c/div>\u003c/article>`}).join('')}\nfunction historyHTML(){return state.attempts.length?'\u003cdetails>\u003csummary>本試用的作答紀錄\u003c/summary>'+state.attempts.map(a=>`\u003cp>${a.startedLocalDate} · ${a.kind==='initial'?'原題':'另一題'} · ${a.submittedAt?'已提交':'未完成'} \u003cbutton data-do=\"show\" data-attempt=\"${E(a.id)}\">${a.submittedAt?'查看':'繼續'}\u003c/button>\u003c/p>`).join('')+'\u003c/details>':''}\nfunction sourceHTML(q){return `\u003ch2>${E(displaySourceLabel(q.source.label))}\u003c/h2>${q.source.image?`\u003cimg src=\"${E(safeURL(q.source.image))}\" alt=\"${E(displaySourceLabel(q.source.label))}\">`:''}\u003cp class=\"pre\">${E(q.source.context)}\u003c/p>${q.source.links.map(l=>`\u003cp>\u003ca href=\"${E(safeURL(l.url))}\" target=\"_blank\" rel=\"noopener\">${E(displaySourceLabel(l.label))}\u003c/a>\u003c/p>`).join('')}\u003cbutton data-do=\"reviewed\" data-q=\"${E(q.id)}\" ${readOnly||busy?'disabled':''}>標記這次已回看\u003c/button>\u003cp class=\"muted\">只記錄你回看過來源，不改變答題結果或熟悉度。\u003c/p>`}\nfunction diag(a,id){return a.diagnosis[id]||(a.diagnosis[id]={reason:null,note:'',reviewedAt:null,enrolled:false})}\nasync function act(action,el){if(busy)return;const a=current(),id=el?.dataset.q;try{\n if(action==='source'){if(!a?.submittedAt||!a.questionIds.includes(id))return;sourceFor=id;$('source-content').innerHTML=sourceHTML(qmap.get(id));$('source-dialog').showModal();return}\n if(action==='close-source'){sourceFor=null;$('source-dialog').close();return}\n if(['show','resume'].includes(action)){if(state.attempts.some(x=>!x.submittedAt)&&a?.id!==el.dataset.attempt){announce('先完成目前這回，再回看其他紀錄。');return}selected=el.dataset.attempt;sourceFor=null;render();$('attempt').scrollIntoView({block:'start'});return}\n if(action==='export'){if(unreadableRaw!==null||readOnly&&!dirty&&!state.attempts.length)return;exportData();return}\n if(action==='export-raw'){if(unreadableRaw!==null){download(m.subject+'-試用原始救援-'+today()+'.txt',unreadableRaw,'text/plain');announce('已準備原始救援副本，請確認下載完成。原內容未轉換，請勿當成相容備份匯入。')}return}\n if(action==='import'){$('file').click();return}\n if(action==='retry'){captureNotes();if((dirty||noteDrafts.size)&&!confirm('本頁仍有未確認保存的試用內容。請先匯出備份；確定重新載入已保存資料嗎？'))return;await load();return}\n if(readOnly)return;\n let next;\n if(action==='start')next=C.start(state,m);\n else if(action==='variant')next=C.start(state,m,el.dataset.record);\n else if(action==='submit'){if(!a||a.submittedAt)return;const blank=a.questionIds.filter(id=>!Object.hasOwn(a.choices,id)).length;if(blank&&!confirm('還有 '+blank+' 題未答。仍要提交完整這回並揭曉嗎？'))return;next=C.submit(state,m,a.id)}\n else if(action==='answer'||action==='certainty'){if(!a||a.submittedAt||!a.questionIds.includes(id))return;next=C.update(state,m,a.id,b=>{if(action==='answer')b.choices[id]=Number(el.dataset.value);else if(el.dataset.value)b.certainty[id]=el.dataset.value;else delete b.certainty[id]})}\n else if(['reason','note','enroll','reviewed'].includes(action)){if(!a?.submittedAt||!a.questionIds.includes(id))return;next=C.update(state,m,a.id,b=>{const d=diag(b,id);if(action==='reason'){d.reason=el.value||null;if(d.reason)d.enrolled=true}if(action==='note'){d.note=document.querySelector('[data-note=\"'+CSS.escape(id)+'\"]').value;if(d.note)d.enrolled=true}if(action==='enroll')d.enrolled=true;if(action==='reviewed')d.reviewedAt=now().toISOString()})}\n if(next){if(action==='start'||action==='variant')selected=next.activeAttemptId;await save(next);if(action==='start'||action==='variant')$('attempt').scrollIntoView({block:'start'});announce(dirty?'仍有未保存內容，請看儲存提示。':'已記錄。')}\n }catch(e){announce(e.message)}}\ndocument.addEventListener('click',e=>{const el=e.target.closest('[data-do]');if(el&&el.tagName!=='SELECT')act(el.dataset.do,el)});\ndocument.addEventListener('input',e=>{if(e.target.matches('[data-note]')){captureNotes();announce('提醒文字尚未儲存；按「儲存一句提醒」後才會保存到網站。')}});\ndocument.addEventListener('change',e=>{if(e.target.matches('select[data-do]'))act(e.target.dataset.do,e.target)});\n$('file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>1000000)throw Error('備份過大，未匯入');const b=JSON.parse(await f.text());if(b.application!=='bounded-review-pilot'||b.format!==1)throw Error('不是相容的試用備份');pendingImport=C.merge(state,b.data,m);$('import-summary').textContent='僅合併同科、同版的試用紀錄，共 '+pendingImport.attempts.length+' 回。不取代舊版作答或學習進度；重複且內容不同的紀錄不會覆寫。';$('import-dialog').showModal()}catch(e){announce(e.message)}});\n$('confirm-import').onclick=async()=>{if(pendingImport){const n=pendingImport;pendingImport=null;$('import-dialog').close();await save(n)}};\n$('cancel-import').onclick=()=>{pendingImport=null;$('import-dialog').close()};\nwindow.addEventListener('storage',e=>{if(!cloud&&e.key===key&&e.newValue!==expectedRaw){readOnly=true;status='另一分頁改動了試用紀錄；本頁未覆寫。請先匯出，再重新載入。';render()}});\nwindow.addEventListener('beforeunload',e=>{captureNotes();if(dirty||busy||noteDrafts.size){e.preventDefault();e.returnValue=''}});\nwindow.addEventListener('focus',()=>render());\n$('source-dialog').addEventListener('close',()=>{sourceFor=null});\nload();\n"},{"path":"source/review-pilot/core.mjs","content":"/* Bounded review pilot. No legacy storage, scheduling or mastery mutations. */\nexport const CERTAINTIES = ['sure','unsure','guess'];\nexport const REASONS = ['not-learned','forgot','misread','method','calculation','rushed'];\nconst obj=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);\nconst exact=(x,keys)=>obj(x)&&Object.keys(x).every(k=>keys.includes(k))&&keys.every(k=>Object.hasOwn(x,k));\nconst fail=()=>{throw Error('試用紀錄格式、版本或題目範圍不相容；已保留原資料，不會覆寫。')};\nconst sameLocalStamp=(at,date,offset)=>new Date(Date.parse(at)+offset*60000).toISOString().slice(0,10)===date;\nconst iso=x=>typeof x==='string'&&/^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d\\.\\d{3}Z$/.test(x)&&!Number.isNaN(Date.parse(x))&&new Date(x).toISOString()===x;\nexport function localDate(date=new Date(),offsetMinutes=-date.getTimezoneOffset()){if(!Number.isInteger(offsetMinutes)||Math.abs(offsetMinutes)>840)fail();return new Date(date.getTime()+offsetMinutes*60000).toISOString().slice(0,10)}\nexport function validDate(s){if(typeof s!=='string'||!/^\\d{4}-\\d\\d-\\d\\d$/.test(s))return false;const d=new Date(s+'T12:00:00Z');return !Number.isNaN(d.getTime())&&d.toISOString().slice(0,10)===s}\nexport function nextDate(s){if(!validDate(s))fail();const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)}\nexport function fresh(m){return {schema:1,subject:m.subject,unitId:m.unitId,manifestVersion:m.version,enabled:false,attempts:[],activeAttemptId:null}}\nexport function stamp(date=new Date(),offsetMinutes=-date.getTimezoneOffset()){return {at:date.toISOString(),date:localDate(date,offsetMinutes),offsetMinutes}}\nexport function outcome(q,a){if(q.neutral)return 'unscored';if(!Object.hasOwn(a.choices,q.id))return 'blank';return q.answers.includes(a.choices[q.id])?'correct':'wrong'}\nexport function recordId(a,qid){return a.id+':'+qid}\nexport function needsReview(q,a){return outcome(q,a)!=='correct'||['unsure','guess'].includes(a.certainty[q.id])||a.diagnosis[q.id]?.enrolled===true}\nexport function records(s,m){const list=[];for(const a of s.attempts.filter(a=>a.submittedAt&&a.kind==='initial'))for(const id of a.questionIds){const q=m.questions.find(q=>q.id===id);if(needsReview(q,a))list.push({id:recordId(a,id),attempt:a,question:q})}return list}\nexport function checkStatus(s,m,r,today=localDate(new Date(),m.dayOffsetMinutes)){\n const checks=s.attempts.filter(a=>a.parentRecordId===r.id&&a.submittedAt);\n const last=checks.at(-1),base=last||r.attempt;\n const used=new Set([r.question.id,...checks.flatMap(a=>a.questionIds)]);\n const candidate=m.pairingReview==='accepted-independent-review'?(m.variants[r.question.id]||[]).find(id=>!used.has(id)):null;\n const lastQ=last&&m.questions.find(q=>q.id===last.questionIds[0]);\n const confirmed=!!last&&outcome(lastQ,last)==='correct'&&last.certainty[lastQ.id]==='sure';\n const due=nextDate(base.submittedLocalDate);\n if(confirmed)return {state:'checked-once',due,candidate:null,last,checks};\n if(!candidate)return {state:'pending-variant',due,candidate:null,last,checks};\n return {state:today>=due?'ready':'another-day',due,candidate,last,checks};\n}\nexport function validate(s,m){\n if(!exact(s,['schema','subject','unitId','manifestVersion','enabled','attempts','activeAttemptId'])||s.schema!==1||s.subject!==m.subject||s.unitId!==m.unitId||s.manifestVersion!==m.version||typeof s.enabled!=='boolean'||!Array.isArray(s.attempts)||s.attempts.length>1000)fail();\n const qmap=new Map(m.questions.map(q=>[q.id,q])),ids=new Set(),seenQuestions=new Set();let initials=0;\n for(const a of s.attempts){\n  if(!exact(a,['id','kind','parentRecordId','questionIds','startedAt','startedLocalDate','startedOffsetMinutes','submittedAt','submittedLocalDate','submittedOffsetMinutes','choices','certainty','diagnosis'])||typeof a.id!=='string'||!/^p-[a-zA-Z0-9-]{8,80}$/.test(a.id)||ids.has(a.id)||!['initial','variant'].includes(a.kind)||!Array.isArray(a.questionIds)||!a.questionIds.length||new Set(a.questionIds).size!==a.questionIds.length||a.questionIds.some(id=>!qmap.has(id)||seenQuestions.has(id))||!iso(a.startedAt)||!validDate(a.startedLocalDate)||!Number.isInteger(a.startedOffsetMinutes)||Math.abs(a.startedOffsetMinutes)>840||!obj(a.choices)||!obj(a.certainty)||!obj(a.diagnosis))fail();\n  if(a.startedOffsetMinutes!==m.dayOffsetMinutes||!sameLocalStamp(a.startedAt,a.startedLocalDate,a.startedOffsetMinutes))fail();\n  const completed=a.submittedAt!==null;\n  if(completed?(!iso(a.submittedAt)||!validDate(a.submittedLocalDate)||!Number.isInteger(a.submittedOffsetMinutes)||Math.abs(a.submittedOffsetMinutes)>840||Date.parse(a.submittedAt)\u003cDate.parse(a.startedAt)):(a.submittedLocalDate!==null||a.submittedOffsetMinutes!==null||Object.keys(a.diagnosis).length))fail();\n  if(completed&&(a.submittedOffsetMinutes!==m.dayOffsetMinutes||!sameLocalStamp(a.submittedAt,a.submittedLocalDate,a.submittedOffsetMinutes)))fail();\n  if(Object.entries(a.choices).some(([id,v])=>!a.questionIds.includes(id)||!Number.isInteger(v)||v\u003c0||v>=qmap.get(id).options.length)||Object.entries(a.certainty).some(([id,v])=>!a.questionIds.includes(id)||!CERTAINTIES.includes(v)))fail();\n  if(Object.entries(a.diagnosis).some(([id,d])=>!a.questionIds.includes(id)||!exact(d,['reason','note','reviewedAt','enrolled'])||!(d.reason===null||REASONS.includes(d.reason))||typeof d.note!=='string'||d.note.length>240||!(d.reviewedAt===null||iso(d.reviewedAt))||typeof d.enrolled!=='boolean'))fail();\n  if(a.kind==='initial'){\n   if(++initials>1||a.parentRecordId!==null||JSON.stringify(a.questionIds)!==JSON.stringify(m.initialIds))fail();\n  }else{\n   const earlier={...s,attempts:s.attempts.filter(x=>ids.has(x.id))};\n   const r=records(earlier,m).find(r=>r.id===a.parentRecordId);\n   if(!r||a.questionIds.length!==1||qmap.get(a.questionIds[0]).groupId||!(m.variants[r.question.id]||[]).includes(a.questionIds[0]))fail();\n   const st=checkStatus(earlier,m,r,a.startedLocalDate);\n   if(st.state!=='ready'||st.candidate!==a.questionIds[0]||Date.parse(a.startedAt)\u003c=Date.parse((st.last||r.attempt).submittedAt))fail();\n  }\n  ids.add(a.id);a.questionIds.forEach(id=>seenQuestions.add(id));\n }\n if(s.attempts.length&&!s.enabled)fail();\n const unfinished=s.attempts.filter(a=>!a.submittedAt);\n if(unfinished.length>1||!(s.activeAttemptId===null||ids.has(s.activeAttemptId))||unfinished.length&&s.activeAttemptId!==unfinished[0].id)fail();\n return structuredClone(s);\n}\nexport function start(s,m,parentRecordId=null,date=new Date(),id='p-'+crypto.randomUUID()){\n validate(s,m);if(s.attempts.some(a=>!a.submittedAt))throw Error('請先完成目前這一回；答案已保留。');\n let questionIds,kind='initial';\n if(parentRecordId){const r=records(s,m).find(x=>x.id===parentRecordId);if(!r)fail();const st=checkStatus(s,m,r,localDate(date,m.dayOffsetMinutes));if(st.state!=='ready')throw Error('目前沒有可開始的跨日另一題。');questionIds=[st.candidate];kind='variant'}\n else{if(s.attempts.length)throw Error('本小單元已開始；請回看紀錄或等待跨日另一題。');questionIds=[...m.initialIds]}\n const t=stamp(date,m.dayOffsetMinutes),a={id,kind,parentRecordId,questionIds,startedAt:t.at,startedLocalDate:t.date,startedOffsetMinutes:t.offsetMinutes,submittedAt:null,submittedLocalDate:null,submittedOffsetMinutes:null,choices:{},certainty:{},diagnosis:{}};\n const n=structuredClone(s);n.enabled=true;n.attempts.push(a);n.activeAttemptId=id;return validate(n,m);\n}\nexport function update(s,m,id,fn){const n=structuredClone(s),a=n.attempts.find(a=>a.id===id);if(!a)fail();fn(a);return validate(n,m)}\nexport function submit(s,m,id,date=new Date()){return update(s,m,id,a=>{if(a.submittedAt)throw Error('這回已提交，原選擇不再更改。');const t=stamp(date,m.dayOffsetMinutes);a.submittedAt=t.at;a.submittedLocalDate=t.date;a.submittedOffsetMinutes=t.offsetMinutes})}\nexport function merge(s,other,m){validate(s,m);validate(other,m);const all=new Map(s.attempts.map(a=>[a.id,a]));for(const a of other.attempts){if(all.has(a.id)&&JSON.stringify(all.get(a.id))!==JSON.stringify(a))throw Error('同一回紀錄有不同內容，未匯入；請先保留兩份備份。');all.set(a.id,a)}const n={...s,enabled:s.enabled||other.enabled,attempts:[...all.values()].sort((a,b)=>a.startedAt.localeCompare(b.startedAt))};const active=n.attempts.find(a=>!a.submittedAt);n.activeAttemptId=active?.id||s.activeAttemptId||other.activeAttemptId;return validate(n,m)}\n"},{"path":"source/review-pilot/pilot.css","content":":root{color-scheme:light;--ink:#173541;--line:#ccd8dc;--tint:#eff5f7;--accent:#155f76}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:17px/1.75 system-ui,-apple-system,sans-serif}main{max-width:940px;margin:auto;padding:28px 24px 72px}h1{font-size:clamp(26px,5vw,38px);line-height:1.3}h2{font-size:24px;line-height:1.4}h3{font-size:20px;line-height:1.7}h4{font-size:18px}p{margin:12px 0}a{color:var(--accent);text-underline-offset:3px}button,input,select{font:inherit;color:inherit}button{min-height:44px;padding:9px 16px;border:1px solid var(--line);border-radius:7px;background:white;cursor:pointer;line-height:1.5}button:disabled{cursor:default;opacity:.55}button[aria-pressed=true]{border:2px solid var(--accent);background:#e7f2f6}button:disabled[aria-pressed=true]{opacity:1}.primary{color:white;background:var(--accent);border-color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #d09a23;outline-offset:4px}fieldset{border:0;padding:12px 0;margin:10px 0;display:flex;flex-wrap:wrap;gap:8px}legend{font-size:15px}.muted{color:#536871;font-size:15px}.warning,.notice{background:#fff7df;border-left:4px solid #a87917;padding:12px 15px;font-size:16px}.card{margin:24px 0;border:1px solid var(--line);border-radius:10px;padding:24px}.question{border-top:1px solid var(--line);padding:24px 0}.options{display:grid;gap:9px}.options button{text-align:left;display:flex;gap:14px}.options strong{flex-shrink:0}.solution{background:var(--tint);padding:22px;margin-top:18px;border-left:4px solid var(--accent)}.pre,.passage div{white-space:pre-wrap;overflow-wrap:anywhere}.passage{background:#f5f7f8;padding:18px;margin:20px 0}.passage summary{font-weight:650;margin-bottom:14px}summary{cursor:pointer;min-height:44px}.diagnosis{margin-top:20px}.diagnosis label{display:block;margin:14px 0}input,select{display:block;width:100%;min-height:44px;margin-top:7px;padding:8px;border:1px solid var(--line);border-radius:5px}.actions{display:flex;flex-wrap:wrap;gap:9px}.record{border-bottom:1px solid var(--line);padding:16px 0}.storage{border-top:1px solid var(--line);margin-top:36px;padding-top:22px}dialog{width:min(92vw,860px);max-height:88vh;border:1px solid var(--line);border-radius:10px;padding:24px;color:var(--ink)}dialog::backdrop{background:#132c3ba8}dialog img{display:block;max-width:100%;height:auto;margin:auto}.dialog-close{position:sticky;top:0;display:block;margin-left:auto}#message{min-height:1.8em;color:var(--accent)}@media(max-width:540px){main{padding:22px 16px 50px}.card{padding:16px}.solution{padding:15px}.actions{display:grid}.question h3{font-size:19px}dialog{padding:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}@media print{button,fieldset,.storage{display:none}}\n[hidden]{display:none!important}\n\n@media screen{\n:is(html[data-theme=dark],:root[data-science-theme=dark]){--ink:#e8f1fa;--line:#2a3e53;--tint:#1b2b3e;--accent:#27d7df;color-scheme:dark}\n:is(html[data-theme=dark],:root[data-science-theme=dark]) body{background:#0b1422;color:#e8f1fa}\n:is(html[data-theme=dark],:root[data-science-theme=dark]) :is(.card,dialog){background:#142131;color:#e8f1fa;border-color:#2a3e53;box-shadow:none;border-radius:12px}\n:is(html[data-theme=dark],:root[data-science-theme=dark]) :is(button,input,select){background:#1b2b3e;color:#e8f1fa;border-color:#607b96}\n:is(html[data-theme=dark],:root[data-science-theme=dark]) :is(.primary,button[aria-pressed=true]){background:#103840;color:#62e3e7;border-color:#27d7df}\n:is(html[data-theme=dark],:root[data-science-theme=dark]) :is(.muted,legend){color:#a6b7ca}\n:is(html[data-theme=dark],:root[data-science-theme=dark]) :is(.passage,.solution){background:#1b2b3e;color:#e8f1fa}\n:is(html[data-theme=dark],:root[data-science-theme=dark]) :is(.warning,.notice){background:#382e20;color:#eac78c;border-color:#eac78c}\n}\n\n/* Submitted selection retains its cue even while controls are disabled. */\n@media screen{\n html[data-theme=light] #attempt .options button[data-do=answer][aria-pressed=true]:disabled{background:#e7f2f6;color:#173541;border-color:#155f76;opacity:1}\n html[data-theme=dark] #attempt .options button[data-do=answer][aria-pressed=true]:disabled{background:#103840;color:#62e3e7;border-color:#27d7df;opacity:1}\n html[data-theme=light] :is(button,a,input,select,summary):focus-visible{outline-color:#845b16}\n}\n\n/* Semantic answer panels. Color identifies the role; prose retains one readable ink. */\n:root{--answer-ink:#243447;--answer-neutral:#f8fafc;--answer-neutral-line:#b7c5d2;--answer-mint-bg:#e7f3ed;--answer-mint-line:#6b9d83;--answer-coral-bg:#fbece8;--answer-coral-line:#c68478;--answer-apricot-bg:#fff2d9;--answer-apricot-line:#ba8b45;--answer-lavender-bg:#f3eff8;--answer-lavender-line:#aa96c2;--answer-cyan:#2e7585}\nhtml[data-theme=dark]{--answer-ink:#e8edf5;--answer-neutral:#172536;--answer-neutral-line:#4d657d;--answer-mint-bg:#17372f;--answer-mint-line:#81b99c;--answer-coral-bg:#3e2a2c;--answer-coral-line:#d9978c;--answer-apricot-bg:#3b3225;--answer-apricot-line:#d6ae6c;--answer-lavender-bg:#2e2b3d;--answer-lavender-line:#afa0c5;--answer-cyan:#83c0cc}\nhtml[data-theme] :is(.explanation,.analysis-block,.solution){background:transparent;color:var(--answer-ink);border-left:0;box-shadow:none}\nhtml[data-theme] :is(.result-banner,.answer-highlight,.overall-explanation){color:var(--answer-ink);border:1px solid;border-left-width:4px;border-radius:10px;padding:16px 20px;margin:18px 0;line-height:1.8;overflow-wrap:anywhere}\nhtml[data-theme] .result-banner{background:var(--answer-neutral);border-color:var(--answer-neutral-line);font-size:18px;font-weight:700}\nhtml[data-theme] .result-banner.correct{background:var(--answer-mint-bg);border-color:var(--answer-mint-line)}\nhtml[data-theme] .result-banner.wrong{background:var(--answer-coral-bg);border-color:var(--answer-coral-line)}\nhtml[data-theme] .answer-highlight{background:var(--answer-apricot-bg);border-color:var(--answer-apricot-line)}\nhtml[data-theme] .overall-explanation{background:var(--answer-lavender-bg);border-color:var(--answer-lavender-line)}\nhtml[data-theme] :is(.result-banner,.answer-highlight,.overall-explanation) :is(p,li,h3,h4,strong,span,.analysis,.learning-point,.learning-label){color:var(--answer-ink)}\nhtml[data-theme] :is(.result-banner,.answer-highlight,.overall-explanation)>:first-child{margin-top:0}\nhtml[data-theme] :is(.result-banner,.answer-highlight,.overall-explanation)>:last-child{margin-bottom:0}\nhtml[data-theme] .answer-keys{gap:8px 14px;align-items:baseline}\nhtml[data-theme] .answer-keys .answer-key{padding:0;background:transparent;color:var(--answer-ink);border:0;border-radius:0}\nhtml[data-theme] :is(.explanation-head,.explanation-content){background:transparent}\nhtml[data-theme] .explanation-head{align-items:flex-start;padding-bottom:0;gap:14px}\nhtml[data-theme] .explanation-head>div{flex:1;min-width:0}\nhtml[data-theme] .explanation-head .result-banner{margin-top:0}\nhtml[data-theme] .ai-badge{white-space:nowrap;color:var(--theme-muted);border:0;background:transparent;padding:6px 0}\nhtml[data-theme] :is(.option-analyses,.option-explanations){display:grid;gap:12px;margin:18px 0;padding:0;list-style:none;counter-reset:answer-option}\nhtml[data-theme] :is(.option-analysis,.option-explanation){background:var(--answer-neutral);border:1px solid var(--answer-neutral-line);border-radius:9px;color:var(--answer-ink);margin:12px 0;padding:16px 18px;line-height:1.8;overflow-wrap:anywhere}\nhtml[data-theme] .option-analyses .option-analysis,html[data-theme] .option-explanations .option-explanation{margin:0}\nhtml[data-theme] .option-analysis .letter{background:transparent;border:1px solid var(--answer-cyan);color:var(--answer-cyan);border-radius:7px;flex-shrink:0}\nhtml[data-theme] .option-explanation>strong{color:var(--answer-cyan);display:block;margin-bottom:8px}\nhtml[data-theme] .option-explanations .option-explanation{counter-increment:answer-option;position:relative;padding-left:54px}\nhtml[data-theme] .option-explanations .option-explanation::before{content:counter(answer-option,upper-alpha);position:absolute;left:18px;top:16px;font-weight:700;color:var(--answer-cyan)}\nhtml[data-theme] :is(.option-analysis,.option-explanation) :is(p,li,span:not(.letter)){color:var(--answer-ink)}\nhtml[data-theme] :is(.option,.choice,#attempt .options button[data-do=answer]){background:var(--answer-neutral);color:var(--answer-ink);border:1px solid var(--answer-neutral-line);opacity:1}\nhtml[data-theme] :is(.option,.choice,#attempt .options button[data-do=answer]):not(:disabled):not(.correct):not(.wrong):hover{background:var(--answer-neutral);border-color:var(--answer-cyan);box-shadow:inset 0 0 0 1px var(--answer-cyan)}\nhtml[data-theme] :is(.option,.choice,#attempt .options button[data-do=answer]):focus-visible{outline:3px solid var(--answer-cyan);outline-offset:3px}\nhtml[data-theme] :is(.choice.selected,.option.neutral-selected,#attempt .options button[data-do=answer][aria-pressed=true]){background:var(--answer-neutral);color:var(--answer-ink);border-color:var(--answer-cyan);box-shadow:inset 0 0 0 1px var(--answer-cyan)}\nhtml[data-theme] :is(.option.correct,.choice.correct,#attempt .options button[data-do=answer].correct),html[data-theme] #attempt .options button[data-do=answer].correct[aria-pressed=true]:disabled{background:var(--answer-mint-bg);border-color:var(--answer-mint-line);color:var(--answer-ink);box-shadow:none}\nhtml[data-theme] :is(.option.wrong,.choice.wrong,#attempt .options button[data-do=answer].wrong),html[data-theme] #attempt .options button[data-do=answer].wrong[aria-pressed=true]:disabled{background:var(--answer-coral-bg);border-color:var(--answer-coral-line);color:var(--answer-ink);box-shadow:none}\nhtml[data-theme] :is(.option,.choice) :is(.option-label,b,.option-status){background:transparent;color:var(--answer-ink);border-color:currentColor}\nhtml[data-theme] :is(.study-keyline,.classical-check[open]>p){background:var(--answer-apricot-bg);color:var(--answer-ink);border:1px solid var(--answer-apricot-line);border-left-width:4px;border-radius:9px;padding:14px 18px}\nhtml[data-theme] .study-analysis{background:var(--answer-lavender-bg);color:var(--answer-ink);border:1px solid var(--answer-lavender-line);border-left-width:4px;border-radius:9px;padding:14px 18px;margin-top:20px}\nhtml[data-theme] .study-analysis :is(summary,p,h4){color:var(--answer-ink)}\nhtml[data-theme] .study-option-note{background:var(--answer-neutral);color:var(--answer-ink);border-left:3px solid var(--answer-cyan);padding:12px 16px;margin-top:12px;border-radius:0 7px 7px 0}\nhtml[data-theme] .study-options .letter{color:var(--answer-cyan)}\nhtml[data-theme] :is(.source-warning,.study-caution,.key-notice,.notice,.warning){color:var(--answer-ink);background:var(--answer-apricot-bg);border-color:var(--answer-apricot-line)}\nhtml[data-theme] :is(.source-warning,.study-caution,.key-notice,.notice,.warning) :is(p,span,strong){color:var(--answer-ink)}\nhtml[data-theme] :is(.notice.error,.warning.error){background:var(--answer-coral-bg);border-color:var(--answer-coral-line)}\nhtml[data-theme] .hintbox{color:var(--answer-ink);background:transparent;border-left:2px solid var(--answer-lavender-line)}\nhtml[data-theme] .solution{padding:0}\nhtml[data-theme] .solution>.diagnosis{padding-top:16px;border-top:1px solid var(--answer-neutral-line)}\n@media(max-width:600px){html[data-theme] :is(.result-banner,.answer-highlight,.overall-explanation){padding:14px 16px}html[data-theme] .explanation-head{display:block}html[data-theme] .ai-badge{display:block;margin-bottom:10px}html[data-theme] :is(.option-analysis,.option-explanation){padding:14px 16px}html[data-theme] .option-explanations .option-explanation{padding-left:48px}html[data-theme] .option-explanations .option-explanation::before{left:15px;top:14px}}\n/* Match legacy state-selector specificity, including locked neutral selections. */\nhtml[data-theme] .option-analysis.correct .letter{background:transparent;border:1px solid var(--answer-cyan);color:var(--answer-cyan)}\nhtml[data-theme] :is(.option.correct,.option.wrong,.option.neutral-selected,.choice.selected,.choice.correct,.choice.wrong) :is(.option-label,b,.option-status){background:transparent;color:var(--answer-ink);border-color:currentColor}\nhtml[data-theme] #attempt .options button[data-do=answer][aria-pressed=true]:disabled:not(.correct):not(.wrong){background:var(--answer-neutral);color:var(--answer-ink);border-color:var(--answer-cyan);box-shadow:inset 0 0 0 1px var(--answer-cyan);opacity:1}\n"},{"path":"source/review-pilot.html","content":"\u003c!doctype html>\u003chtml lang=\"zh-Hant\">\u003chead>\u003cscript src=\"/reference-theme.js\">\u003c/script>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>英文 · 錯因回看小試用\u003c/title>\u003clink rel=\"stylesheet\" href=\"/review-pilot/pilot.css\">\u003clink rel=\"stylesheet\" href=\"/reference-theme.css\">\u003c/head>\u003cbody>\u003cmain>\u003ca id=\"back\" href=\"/\">回到原站\u003c/a>\u003cheader>\u003cdiv class=\"appearance\" role=\"group\" aria-label=\"外觀\">\u003cbutton type=\"button\" data-appearance=\"light\">淺色\u003c/button>\u003cbutton type=\"button\" data-appearance=\"dark\">深色\u003c/button>\u003cbutton type=\"button\" data-appearance=\"system\">系統\u003c/button>\u003cspan id=\"appearanceStatus\" class=\"appearance-status\" role=\"status\">\u003c/span>\u003c/div>\u003cp id=\"subject\" class=\"muted\">\u003c/p>\u003ch1 id=\"title\">錯因回看小試用\u003c/h1>\u003cp id=\"scope\">\u003c/p>\u003cp id=\"local-date\" class=\"muted\">\u003c/p>\u003c/header>\u003cp id=\"storage-status\" role=\"status\">\u003c/p>\u003cp id=\"message\" role=\"status\" aria-live=\"polite\">\u003c/p>\u003csection id=\"overview\">\u003c/section>\u003csection id=\"attempt\" aria-label=\"本回作答\">\u003c/section>\u003csection>\u003ch2>錯因、回看與跨日檢查\u003c/h2>\u003cdiv id=\"records\">\u003c/div>\u003c/section>\u003csection id=\"history\">\u003c/section>\u003csection class=\"storage\">\u003ch2>試用紀錄備份\u003c/h2>\u003cp class=\"muted\">這份只含本試用的作答、把握度、錯因與你填的提醒。舊版備份功能照常保留；要完整備份，請分別匯出。\u003c/p>\u003cdiv class=\"actions\">\u003cbutton id=\"export\" data-do=\"export\">匯出試用紀錄\u003c/button>\u003cbutton id=\"export-raw\" data-do=\"export-raw\" hidden>下載未能讀取的原始救援副本\u003c/button>\u003cbutton id=\"import\" data-do=\"import\">合併試用備份\u003c/button>\u003cbutton id=\"retry\" data-do=\"retry\" hidden>重新載入已保存紀錄\u003c/button>\u003c/div>\u003cinput id=\"file\" type=\"file\" accept=\"application/json,.json\" hidden>\u003c/section>\u003c/main>\u003cdialog id=\"source-dialog\" aria-label=\"回看已審来源\">\u003cbutton class=\"dialog-close\" data-do=\"close-source\">關閉回看\u003c/button>\u003cdiv id=\"source-content\">\u003c/div>\u003c/dialog>\u003cdialog id=\"import-dialog\" aria-labelledby=\"import-heading\">\u003ch2 id=\"import-heading\">確認合併試用紀錄\u003c/h2>\u003cp id=\"import-summary\">\u003c/p>\u003cbutton id=\"cancel-import\">取消\u003c/button>\u003cbutton id=\"confirm-import\" class=\"primary\">確認合併\u003c/button>\u003c/dialog>\u003cscript type=\"module\" src=\"/review-pilot/app.mjs\">\u003c/script>\u003c/body>\u003c/html>\n"}]}</script></body></html>
